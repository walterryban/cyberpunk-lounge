<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALERTA URBANA GPS // SPATIAL LOUNGE</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f3ff">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #030308;
            --panel-bg: rgba(6, 10, 20, 0.9);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-green: #00ff66;
            --text-main: #d0e0ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: var(--panel-bg);
            border-bottom: 2px solid var(--neon-cyan);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.25);
            z-index: 20;
        }
        .logo { font-size: 1.1rem; font-weight: 900; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); letter-spacing: 1px; }
        .status-panel { display: flex; gap: 10px; font-size: 0.8rem; align-items: center; }
        .badge { background: rgba(0, 243, 255, 0.08); border: 1px solid var(--neon-cyan); padding: 5px 10px; border-radius: 4px; }
        
        .main-container { flex: 1; display: flex; position: relative; overflow: hidden; }
        
        #lounge-canvas-container {
            flex: 1; position: relative;
            background-image: radial-gradient(circle at center, rgba(0, 243, 255, 0.05) 0%, transparent 70%), linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            cursor: crosshair;
        }
        
        .node {
            position: absolute; width: 65px; height: 65px; border-radius: 50%;
            background: rgba(10, 15, 30, 0.95); border: 2px solid var(--neon-cyan);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transform: translate(-50%, -50%); transition: left 0.15s ease-out, top 0.15s ease-out, border-color 0.2s, box-shadow 0.2s;
            z-index: 5;
        }
        .node.self { border-color: var(--neon-pink); box-shadow: 0 0 25px rgba(255, 0, 85, 0.7); }
        .node.nearby { border-color: var(--neon-green); box-shadow: 0 0 30px rgba(0, 255, 102, 0.8); }
        .node-avatar { font-size: 1.3rem; }
        .node-name { font-size: 0.6rem; color: #fff; max-width: 55px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }
        
        #chat-panel { width: 240px; background: var(--panel-bg); border-left: 2px solid var(--neon-cyan); display: flex; flex-direction: column; z-index: 10; }
        .chat-header { padding: 10px; background: rgba(0, 243, 255, 0.1); border-bottom: 1px solid var(--neon-cyan); font-size: 0.75rem; font-weight: bold; color: var(--neon-cyan); }
        .chat-messages { flex: 1; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 0.75rem; }
        .msg { background: rgba(255, 255, 255, 0.03); border-left: 3px solid var(--neon-cyan); padding: 6px; border-radius: 2px; }
        .msg.self-msg { border-left-color: var(--neon-pink); background: rgba(255, 0, 85, 0.05); }
        .msg-author { font-weight: bold; color: var(--neon-cyan); }
        .msg.self-msg .msg-author { color: var(--neon-pink); }
        .msg-text { color: #fff; word-break: break-word; }
        
        .chat-input-area { padding: 8px; border-top: 1px solid rgba(0, 243, 255, 0.3); display: flex; gap: 4px; }
        .chat-input-area input { flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--neon-cyan); color: #fff; padding: 8px; border-radius: 4px; outline: none; font-size: 0.8rem; }
        
        button { background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px 12px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        button:hover { background: var(--neon-cyan); color: #000; }

        /* BOTÓN FLOTANTE DE MICRÓFONO */
        #mic-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 1000;
            background: rgba(6, 10, 20, 0.9);
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #mic-btn.active {
            background: var(--neon-green) !important;
            color: #000 !important;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.8) !important;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">ALERTA URBANA // LOUNGE</div>
        <div class="status-panel">
            <div class="badge">RED: <span id="status-text" style="color: var(--neon-pink);">CONECTANDO...</span></div>
        </div>
    </header>

    <div class="main-container">
        <div id="lounge-canvas-container"></div>
        <div id="chat-panel">
            <div class="chat-header">// RED CANAL ABIERTO</div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Mensaje..." onkeydown="if(event.key==='Enter') sendChat()">
                <button onclick="sendChat()">></button>
            </div>
        </div>
    </div>

    <!-- BOTÓN FLOTANTE -->
    <button id="mic-btn" onclick="toggleMic()">🎤 ACTIVAR MIC</button>

    <script>
        // --- CONFIGURACIÓN ---
        const SUPABASE_URL = 'https://oavnuccigegmhtqviwlh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_mObzFeoHbIXNgtd7OVuiiw_djbegTS7';
        const HF_TOKEN = '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'; // Token solo lectura
        const TURN_ENDPOINT = 'https://turn.fastrtc.org/credentials';
        const PROXIMITY_THRESHOLD = 150;
        const MAX_AUDIO_DISTANCE = 200;

        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { realtime: { params: { eventsPerSecond: 10 } } });
        const container = document.getElementById('lounge-canvas-container');
        const chatMessages = document.getElementById('chat-messages');
        const micBtn = document.getElementById('mic-btn');

        const myNode = {
            id: 'NODE-' + Math.floor(1000 + Math.random() * 9000),
            name: 'MOVIL-' + Math.floor(10 + Math.random() * 90),
            x: window.innerWidth / 3,
            y: window.innerHeight / 2
        };
        const activeNodes = {};
        let localStream = null;
        let audioContext = null;
        let micActive = false;
        const peerConnections = {};
        const audioElements = {};
        const gainNodes = {};
        let turnCredentials = null;

        async function fetchTurnCredentials() {
            try {
                const res = await fetch(`${TURN_ENDPOINT}?ttl=3600`, {
                    headers: { 'Authorization': `Bearer ${HF_TOKEN}` }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                turnCredentials = data.iceServers;
                console.log('TURN credentials obtenidas:', turnCredentials);
            } catch (e) {
                console.warn('No se pudieron obtener credenciales TURN, usando solo STUN:', e);
                turnCredentials = [{ urls: 'stun:stun.l.google.com:19302' }];
            }
        }

        const channel = dbClient.channel('alerta-urbana-room', { config: { broadcast: { self: true, ack: false } } });

        channel.on('broadcast', { event: 'node-moved' }, (payload) => {
            const data = payload.payload;
            if (data.id !== myNode.id) {
                activeNodes[data.id] = data;
                renderRemoteNode(data);
                checkProximity();
            }
        });

        channel.on('broadcast', { event: 'webrtc-signal' }, async (payload) => {
            const { targetId, fromId, signal } = payload.payload;
            if (targetId !== myNode.id) return;
            const pc = peerConnections[fromId];
            if (!pc) return;
            if (signal.type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(signal));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                channel.send({ type: 'broadcast', event: 'webrtc-signal', payload: { targetId: fromId, fromId: myNode.id, signal: answer } });
            } else if (signal.type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription(signal));
            } else if (signal.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
            }
        });

        channel.on('broadcast', { event: 'new-message' }, (payload) => appendChatMessage(payload.payload));

        channel.subscribe(async (status) => {
            const statusEl = document.getElementById('status-text');
            if (status === 'SUBSCRIBED') {
                statusEl.textContent = "ONLINE";
                statusEl.style.color = "var(--neon-green)";
                renderMyNode();
                broadcastMyPosition();
                await fetchTurnCredentials();
            } else {
                statusEl.textContent = "RECONECTANDO...";
                statusEl.style.color = "var(--neon-pink)";
            }
        });

        async function toggleMic() {
            if (micActive) {
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                localStream = null;
                micActive = false;
                micBtn.textContent = '🎤 ACTIVAR MIC';
                micBtn.classList.remove('active');
                Object.keys(peerConnections).forEach(id => closePeer(id));
            } else {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    micActive = true;
                    micBtn.textContent = '🔴 MIC ACTIVO';
                    micBtn.classList.add('active');
                    checkProximity();
                } catch (e) {
                    alert('No se pudo acceder al micrófono: ' + e.message);
                }
            }
        }

        function checkProximity() {
            if (!micActive || !localStream) return;
            for (const remoteId in activeNodes) {
                const remote = activeNodes[remoteId];
                const dist = Math.hypot(myNode.x - remote.x, myNode.y - remote.y);
                if (dist < PROXIMITY_THRESHOLD) {
                    if (!peerConnections[remoteId]) createPeer(remoteId);
                    if (gainNodes[remoteId]) {
                        const vol = Math.max(0, 1 - (dist / MAX_AUDIO_DISTANCE));
                        gainNodes[remoteId].gain.setTargetAtTime(vol, audioContext.currentTime, 0.1);
                    }
                } else {
                    if (peerConnections[remoteId]) closePeer(remoteId);
                }
            }
        }

        async function createPeer(remoteId) {
            if (peerConnections[remoteId]) return;
            const pc = new RTCPeerConnection({ iceServers: turnCredentials || [{ urls: 'stun:stun.l.google.com:19302' }] });
            peerConnections[remoteId] = pc;

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    channel.send({ type: 'broadcast', event: 'webrtc-signal', payload: { targetId: remoteId, fromId: myNode.id, signal: { candidate: e.candidate } } });
                }
            };

            pc.ontrack = (e) => {
                const remoteStream = e.streams[0];
                if (!audioElements[remoteId]) {
                    const audio = new Audio();
                    audio.srcObject = remoteStream;
                    audio.autoplay = true;
                    audioElements[remoteId] = audio;
                }
                if (audioContext && !gainNodes[remoteId]) {
                    const source = audioContext.createMediaStreamSource(remoteStream);
                    const gain = audioContext.createGain();
                    source.connect(gain);
                    gain.connect(audioContext.destination);
                    gainNodes[remoteId] = gain;
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            channel.send({ type: 'broadcast', event: 'webrtc-signal', payload: { targetId: remoteId, fromId: myNode.id, signal: offer } });
        }

        function closePeer(remoteId) {
            if (peerConnections[remoteId]) {
                peerConnections[remoteId].close();
                delete peerConnections[remoteId];
            }
            if (audioElements[remoteId]) {
                audioElements[remoteId].srcObject = null;
                delete audioElements[remoteId];
            }
            if (gainNodes[remoteId]) {
                gainNodes[remoteId].disconnect();
                delete gainNodes[remoteId];
            }
        }

        function broadcastMyPosition() {
            channel.send({ type: 'broadcast', event: 'node-moved', payload: myNode });
        }

        function updatePosition(e) {
            const rect = container.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            myNode.x = clientX - rect.left;
            myNode.y = clientY - rect.top;
            renderMyNode();
            broadcastMyPosition();
            checkProximity();
        }
        container.addEventListener('click', updatePosition);

        function renderMyNode() {
            let el = document.getElementById(`node-${myNode.id}`);
            if (!el) {
                el = document.createElement('div');
                el.id = `node-${myNode.id}`;
                el.className = 'node self';
                el.innerHTML = `<div class="node-avatar">📱</div><div class="node-name">${myNode.name}</div>`;
                container.appendChild(el);
            }
            el.style.left = `${myNode.x}px`;
            el.style.top = `${myNode.y}px`;
        }

        function renderRemoteNode(data) {
            let el = document.getElementById(`node-${data.id}`);
            if (!el) {
                el = document.createElement('div');
                el.id = `node-${data.id}`;
                el.className = 'node';
                el.innerHTML = `<div class="node-avatar">📡</div><div class="node-name">${data.name}</div>`;
                container.appendChild(el);
            }
            el.style.left = `${data.x}px`;
            el.style.top = `${data.y}px`;
            const dist = Math.hypot(myNode.x - data.x, myNode.y - data.y);
            el.classList.toggle('nearby', dist < PROXIMITY_THRESHOLD && micActive);
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const textValue = input.value.trim();
            if (textValue !== '') {
                channel.send({ type: 'broadcast', event: 'new-message', payload: { senderId: myNode.id, senderName: myNode.name, text: textValue, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) } });
                input.value = '';
            }
        }

        function appendChatMessage(data) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${data.senderId === myNode.id ? 'self-msg' : ''}`;
            msgDiv.innerHTML = `<div class="msg-author">${data.senderName} <span style="font-size:0.6rem; color:#777;">[${data.time}]</span></div><div class="msg-text">${data.text}</div>`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
